<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrol Micro:Bit</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%2322d3ee' stroke-width='12'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23f8fafc'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0b1220;
      --bg-2: #101a30;
      --card: rgba(255, 255, 255, .05);
      --card-border: rgba(148, 163, 184, .16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --brand: #22d3ee;
      --brand-2: #6366f1;
      --success: #34d399;
      --danger: #f87171;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: radial-gradient(1200px 800px at 85% -10%, rgba(99, 102, 241, .28), transparent 55%),
                  radial-gradient(1000px 700px at -10% 110%, rgba(34, 211, 238, .22), transparent 55%),
                  linear-gradient(160deg, var(--bg), var(--bg-2));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      -webkit-tap-highlight-color: transparent;
    }

    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      animation: rise .5s ease both;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(140deg, rgba(34, 211, 238, .2), rgba(99, 102, 241, .2));
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(34, 211, 238, .15);
    }

    .brand h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: .2px; }

    .brand .sub { font-size: .78rem; color: var(--muted); }

    .head-actions { display: flex; align-items: center; gap: 8px; }

    #status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .82rem;
      font-weight: 600;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(148, 163, 184, .1);
      border: 1px solid var(--card-border);
    }

    #status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      box-shadow: 0 0 0 0 rgba(100, 116, 139, .4);
    }

    #status.connected {
      color: var(--success);
      background: rgba(52, 211, 153, .12);
      border-color: rgba(52, 211, 153, .3);
    }

    #status.connected .dot {
      background: var(--success);
      animation: pulse 1.6s infinite;
    }

    #status.connecting {
      color: var(--warn);
      background: rgba(251, 191, 36, .1);
      border-color: rgba(251, 191, 36, .3);
    }

    #status.connecting .dot {
      background: var(--warn);
      animation: pulse 1s infinite;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 600;
      transition: transform .08s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
      user-select: none;
    }

    button:active:not(:disabled) { transform: scale(.96); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    #connectBtn {
      padding: 10px 18px;
      font-size: .9rem;
      color: #04121a;
      border: none;
      background: linear-gradient(135deg, var(--brand), #38bdf8);
      box-shadow: 0 6px 18px rgba(34, 211, 238, .35);
    }

    #connectBtn:hover:not(:disabled) { box-shadow: 0 8px 24px rgba(34, 211, 238, .5); }

    #connectBtn.disconnect {
      color: #fff;
      background: linear-gradient(135deg, #f87171, #ef4444);
      box-shadow: 0 6px 18px rgba(239, 68, 68, .3);
    }

    #connectBtn.disconnect:hover { box-shadow: 0 8px 22px rgba(239, 68, 68, .45); }

    main {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 24px;
    }

    section {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: rise .5s ease both;
    }

    section:nth-child(1) { animation-delay: .08s; }
    section:nth-child(2) { animation-delay: .16s; }

    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    h2 .ico { font-size: 1rem; }

    .sensor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .sensor-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--card-border);
    }

    .sensor-card .icon {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      background: rgba(251, 146, 60, .16);
      color: #fb923c;
    }

    .sensor-card.kelembaban .icon {
      background: rgba(96, 165, 250, .16);
      color: #60a5fa;
    }

    .sensor-card .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

    .sensor-card .label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .sensor-card .value {
      font-family: "SF Mono", ui-monospace, "Cascadia Code", "Consolas", monospace;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
    }

    .sensor-card .value::first-letter { font-size: 1.7rem; }

    .sensor-card.flash {
      animation: flash .6s ease;
      border-color: rgba(34, 211, 238, .45);
    }

    @keyframes flash {
      0% { background: rgba(34, 211, 238, .22); }
      100% { background: rgba(255, 255, 255, .04); }
    }

    .dpad-wrap { display: flex; justify-content: center; }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 84px);
      grid-template-rows: repeat(3, 84px);
      gap: 10px;
    }

    .dpad button {
      width: 84px;
      height: 84px;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e2e8f0;
      background: rgba(255, 255, 255, .06);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      transition: transform .08s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .dpad button:hover { background: rgba(255, 255, 255, .1); border-color: rgba(148, 163, 184, .35); }

    .dpad button:active,
    .dpad button.pressed {
      background: linear-gradient(135deg, rgba(34, 211, 238, .3), rgba(99, 102, 241, .3));
      border-color: rgba(34, 211, 238, .6);
      box-shadow: 0 0 22px rgba(34, 211, 238, .4), inset 0 0 12px rgba(34, 211, 238, .25);
      transform: scale(.94);
      color: #fff;
    }

    .dpad .center {
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, .14), rgba(255, 255, 255, .04));
    }

    .dpad .center:active,
    .dpad .center.pressed {
      background: radial-gradient(circle at 30% 30%, rgba(251, 113, 133, .45), rgba(239, 68, 68, .35));
      border-color: rgba(251, 113, 133, .65);
      box-shadow: 0 0 22px rgba(244, 63, 94, .45), inset 0 0 12px rgba(244, 63, 94, .3);
    }

    .hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
      font-size: .78rem;
      color: var(--muted);
    }

    .hint kbd {
      font-family: inherit;
      font-size: .72rem;
      font-weight: 600;
      color: var(--text);
      background: rgba(255, 255, 255, .08);
      border: 1px solid var(--card-border);
      border-bottom-width: 2px;
      border-radius: 6px;
      padding: 2px 7px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: rgba(15, 23, 42, .94);
      border: 1px solid var(--card-border);
      color: var(--text);
      font-size: .85rem;
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .4);
      transition: opacity .25s ease, transform .25s ease;
      z-index: 50;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(248, 113, 113, .5); color: #fecaca; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, .5); }
      70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .sensor-grid { grid-template-columns: 1fr; }
      .dpad { grid-template-columns: repeat(3, 76px); grid-template-rows: repeat(3, 76px); gap: 8px; }
      .dpad button { width: 76px; height: 76px; }
      .brand h1 { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="42" stroke="#22d3ee" stroke-width="12"/>
        <circle cx="50" cy="50" r="8" fill="#f8fafc"/>
      </svg>
    </div>
    <div>
      <h1>Kontrol Micro:Bit</h1>
      <div class="sub">Kendali robot &amp; pembacaan sensor via Bluetooth</div>
    </div>
  </div>
  <div class="head-actions">
    <span id="status"><span class="dot"></span>Terputus</span>
    <button id="connectBtn">Hubungkan Bluetooth</button>
  </div>
</header>

<main>
  <section>
    <h2><span class="ico">📡</span> Sensor</h2>
    <div class="sensor-grid">
      <div class="sensor-card">
        <div class="icon">🌡</div>
        <div class="meta">
          <span class="label">Suhu</span>
          <span class="value" id="valSuhu">-- °C</span>
        </div>
      </div>
      <div class="sensor-card kelembaban">
        <div class="icon">💧</div>
        <div class="meta">
          <span class="label">Kelembaban</span>
          <span class="value" id="valKelembaban">-- %</span>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2><span class="ico">🎮</span> Kontrol Arah</h2>
    <div class="dpad-wrap">
      <div class="dpad">
        <button class="up" data-action="up">▲</button>
        <button class="left" data-action="left">◀</button>
        <button class="center" data-action="horn">●</button>
        <button class="right" data-action="right">▶</button>
        <button class="down" data-action="down">▼</button>
      </div>
    </div>
    <div class="hint">
      Tahan tombol untuk bergerak · lepas untuk <span class="stop-label">berhenti</span>
      <span class="kbd-hint"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><kbd>H</kbd></span>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
  const UART_SERVICE = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
  const RX_UUID      = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
  const TX_UUID      = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

  let bleDevice = null;
  let txChar = null;
  let isConnected = false;
  let isConnecting = false;

  const statusEl    = document.getElementById('status');
  const connectBtn  = document.getElementById('connectBtn');
  const valSuhu     = document.getElementById('valSuhu');
  const valKelembaban = document.getElementById('valKelembaban');
  const toastEl     = document.getElementById('toast');

  let toastTimer = null;
  function showToast(msg, isError = false) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('error', isError);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  async function sendUART(data) {
    if (!txChar) return;
    try {
      await txChar.writeValue(new TextEncoder().encode(data + '\n'));
    } catch (e) {
      console.error('TX Error:', e);
    }
  }

  function updateUI(connected) {
    isConnected = connected;
    statusEl.textContent = connected ? 'Terhubung' : (isConnecting ? 'Menghubungkan…' : 'Terputus');
    statusEl.className = connected ? 'connected' : (isConnecting ? 'connecting' : '');
    connectBtn.textContent = connected ? 'Putuskan' : 'Hubungkan Bluetooth';
    connectBtn.className = connected ? 'disconnect' : '';
    connectBtn.disabled = isConnecting;
  }

  connectBtn.addEventListener('click', async () => {
    if (isConnected) {
      if (bleDevice && bleDevice.gatt) bleDevice.gatt.disconnect();
      return;
    }
    if (isConnecting) return;
    isConnecting = true;
    updateUI(false);

    try {
      bleDevice = await navigator.bluetooth.requestDevice({
        filters: [{ namePrefix: 'BBC micro:bit' }],
        optionalServices: [UART_SERVICE]
      });

      bleDevice.addEventListener('gattserverdisconnected', () => {
        isConnected = false;
        txChar = null;
        updateUI(false);
        showToast('Koneksi Bluetooth terputus.');
      });

      const server = await bleDevice.gatt.connect();
      const service = await server.getPrimaryService(UART_SERVICE);

      const rxChar = await service.getCharacteristic(RX_UUID);
      await rxChar.startNotifications();
      rxChar.addEventListener('characteristicvaluechanged', (e) => {
        const val = new TextDecoder().decode(e.target.value).trim();
        if (!val) return;
        const parts = val.split(':');
        if (parts.length === 2) {
          const key = parts[0].toLowerCase();
          const num = parseFloat(parts[1]);
          if (!isNaN(num)) {
            if (key === 'suhu') {
              valSuhu.textContent = num + ' °C';
              flash(valSuhu);
            } else if (key === 'kelembaban') {
              valKelembaban.textContent = num + ' %';
              flash(valKelembaban);
            }
          }
        }
      });

      txChar = await service.getCharacteristic(TX_UUID);
      updateUI(true);
      showToast('Terhubung ke Micro:Bit ✓');
    } catch (err) {
      console.error(err);
      let msg = err && err.message ? err.message : String(err);
      const map = {
        'User cancelled': 'Pemilihan perangkat dibatalkan.',
        'No Services found': 'Layanan UART tidak ditemukan pada perangkat.',
        'Bluetooth Device no longer in range': 'Perangkat di luar jangkauan.'
      };
      showToast('Gagal terhubung: ' + (map[msg] || msg), true);
      updateUI(false);
    } finally {
      isConnecting = false;
      if (!isConnected) updateUI(false);
    }
  });

  // Flash effect ketika ada pembaruan nilai sensor
  function flash(el) {
    el.parentElement.classList.remove('flash');
    void el.parentElement.offsetWidth;
    el.parentElement.classList.add('flash');
  }

  // D-pad
  document.querySelectorAll('.dpad button[data-action]').forEach(btn => {
    const action = btn.dataset.action;

    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      btn.classList.add('pressed');
      if (action !== 'horn') showToast('Perintah: ' + actionLabel(action));
      sendUART(action);
      if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId);
    });

    const stop = (e) => {
      btn.classList.remove('pressed');
      sendUART('stop');
      if (e && e.pointerId != null && btn.hasPointerCapture && btn.hasPointerCapture(e.pointerId)) {
        btn.releasePointerCapture(e.pointerId);
      }
    };

    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('pointerleave', stop);
  });

  function actionLabel(a) {
    return { up: 'Maju ▲', down: 'Mundur ▼', left: 'Kiri ◀', right: 'Kanan ▶', horn: 'Klakson ●' }[a] || a;
  }

  // Keyboard — memudahkan pengujian di laptop (tidak menghapus kontrol asli)
  const keyMap = {
    ArrowUp: 'up', w: 'up', W: 'up',
    ArrowDown: 'down', s: 'down', S: 'down',
    ArrowLeft: 'left', a: 'left', A: 'left',
    ArrowRight: 'right', d: 'right', D: 'right',
    h: 'horn', H: 'horn', ' ': 'horn'
  };
  const pressed = new Set();

  document.addEventListener('keydown', (e) => {
    const action = keyMap[e.key];
    if (!action) return;
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    if (pressed.has(action)) return;
    pressed.add(action);
    const btn = document.querySelector('.dpad button[data-action="' + action + '"]');
    if (btn) btn.classList.add('pressed');
    sendUART(action);
  });

  document.addEventListener('keyup', (e) => {
    const action = keyMap[e.key];
    if (!action) return;
    pressed.delete(action);
    if (pressed.size === 0) {
      const btn = document.querySelector('.dpad button[data-action="' + action + '"]');
      if (btn) btn.classList.remove('pressed');
      sendUART('stop');
    }
  });

  updateUI(false);
</script>
</body>
</html>
